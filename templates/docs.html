<!-- PAGE -->
<div class="page">

  <div class="page-title">PROJECT <em>DOCS</em></div>

  <table class="doc-table">

    <tbody>

      <!-- Row 1 — Research Paper -->
      <tr>
        <div class="row-accent"></div>
        <td>
          <span style="font-family:'Share Tech Mono',monospace; font-size:0.65rem; color:var(--dim);">01</span>
        </td>
        <td>
          <div class="doc-name-cell">
            <div class="doc-icon-wrap">
              <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                <rect x="3" y="1" width="13" height="17" rx="1" stroke="#00f5ff" stroke-width="0.9" fill="rgba(0,245,255,0.05)"/>
                <path d="M3 5 L16 5" stroke="rgba(0,245,255,0.2)" stroke-width="0.7"/>
                <path d="M6 8 L13 8 M6 11 L13 11 M6 14 L10 14" stroke="rgba(0,245,255,0.4)" stroke-width="0.7" stroke-linecap="round"/>

            </div>
            <div>

              <span class="doc-sub">Fighter Jet Classification using EfficientNetV2S</span>
            </div>
          </div>
        </td>
        <td><span class="type-badge cyan">RESEARCH</span></td>
        <!-- <td class="doc-size">PDF · ~2–4 MB</td> -->
        <td>
          <a class="dl-btn" href="/static/docs/sample.pdf" download>
            <svg class="dl-icon" width="13" height="13" viewBox="0 0 13 13" fill="none">
              <path d="M6.5 1 L6.5 9 M3.5 6.5 L6.5 9.5 L9.5 6.5" stroke="#00f5ff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M1 10.5 L1 12 L12 12 L12 10.5" stroke="#00f5ff" stroke-width="1.1" stroke-linecap="round"/>
            </svg>
            DOWNLOAD
          </a>
        </td>
      </tr>

      <!-- Row 2 — Report -->
      <tr>
        <div class="row-accent"></div>
        <td>
          <span style="font-family:'Share Tech Mono',monospace; font-size:0.65rem; color:var(--dim);">02</span>
        </td>
        <td>
          <div class="doc-name-cell">
            <div class="doc-icon-wrap amber">
              <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                <rect x="3" y="1" width="13" height="17" rx="1" stroke="#ffb830" stroke-width="0.9" fill="rgba(255,184,48,0.05)"/>
                <path d="M3 5 L16 5" stroke="rgba(255,184,48,0.2)" stroke-width="0.7"/>
                <path d="M6 8 L13 8 M6 11 L11 11 M6 14 L13 14" stroke="rgba(255,184,48,0.4)" stroke-width="0.7" stroke-linecap="round"/>
                <polyline points="14,13 14,18 19,18" stroke="#ffb830" stroke-width="0.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline points="14,15.5 16,17 19,14" stroke="#ffb830" stroke-width="0.9" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
              </svg>
            </div>
            <div>
              <span class="doc-name amber">PROJECT REPORT</span>
              <span class="doc-sub">AEROVISION — Full Technical Report · UG</span>
            </div>
          </div>
        </td>
        <td><span class="type-badge amber">REPORT</span></td>

        <td>
          <a class="dl-btn amber" href="#" download>
            <svg class="dl-icon" width="13" height="13" viewBox="0 0 13 13" fill="none">

            DOWNLOAD
